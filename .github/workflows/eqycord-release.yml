name: EqyCord release channel
on:
    push:
        branches: [feature/eqycord-plugin-origins]
        paths: [src/**, scripts/**, browser/**, package.json, pnpm-lock.yaml, .github/workflows/eqycord-release.yml]
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: eqycord-release
    cancel-in-progress: false
jobs:
    release:
        if: github.repository == 'zztwi/EqyCord'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm testTsc && pnpm lint && pnpm lint-styles
            - run: node --test scripts/eqycord/profile-service.test.mjs scripts/eqycord/badges.test.mjs scripts/eqycord/updater.test.mjs
            - run: pnpm buildStandalone && pnpm buildWeb
            - run: node scripts/eqycord/release-manifest.mjs
            - name: Publish exact tested build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="eqycord-${GITHUB_SHA:0:8}"
                  git archive --format=zip --output=dist/EqyCord-source.zip HEAD
                  if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
                  gh release create "$tag" --target "$GITHUB_SHA" --title "EqyCord ${GITHUB_SHA:0:8}" --notes "EqyCord client update. Matching source and checksummed update manifest included." --latest dist/patcher.js dist/preload.js dist/renderer.js dist/renderer.css dist/vencordDesktopMain.js dist/vencordDesktopPreload.js dist/vencordDesktopRenderer.js dist/vencordDesktopRenderer.css dist/eqycord-update.json dist/EqyCord-source.zip dist/extension-chrome.zip dist/extension-firefox.zip


